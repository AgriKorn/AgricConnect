name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
    branches:
      - dev
      - main

jobs:
  ci:
    name: Backend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Compile TypeScript (Build)
        run: npm run build
