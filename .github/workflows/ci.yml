name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
    branches:
      - dev
      - main

jobs:
  ci:
    name: Backend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      # src/generated/prisma is gitignored, so the client does not exist in a
      # fresh checkout. Without this every import of it fails to resolve and the
      # build reports "Cannot find module '../../generated/prisma/client'",
      # followed by a cascade of implicit-any errors on the Prisma callbacks.
      # deploy.yml already does this; ci.yml did not, and only noticed on the
      # first pull request to actually run it.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linting
        run: npm run lint

      - name: Compile TypeScript (Build)
        run: npm run build

      - name: Run Tests
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
