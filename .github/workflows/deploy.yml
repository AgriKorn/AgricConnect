name: Backend CD (AWS ECR & Lightsail Containers)

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
    branches:
      - main
      - feature/K1-scaffolding
      - feature/frontend-integration
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test, Build Docker & Deploy to AWS Lightsail
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: agriconnect-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to AWS Lightsail Container Service (container-service-1)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: agriconnect-backend
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AWS_S3_BUCKET_PUBLIC: ${{ secrets.AWS_S3_BUCKET_PUBLIC }}
          AWS_S3_BUCKET_PRIVATE: ${{ secrets.AWS_S3_BUCKET_PRIVATE }}
        run: |
          aws lightsail create-container-service-deployment \
            --service-name container-service-1 \
            --containers "{\"backend\":{\"image\":\"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\",\"environment\":{\"NODE_ENV\":\"production\",\"PORT\":\"3000\",\"DATABASE_URL\":\"$DATABASE_URL\",\"JWT_SECRET\":\"$JWT_SECRET\",\"PAYSTACK_SECRET_KEY\":\"$PAYSTACK_SECRET_KEY\",\"SUPABASE_URL\":\"$SUPABASE_URL\",\"SUPABASE_ANON_KEY\":\"$SUPABASE_ANON_KEY\",\"AWS_S3_BUCKET_PUBLIC\":\"$AWS_S3_BUCKET_PUBLIC\",\"AWS_S3_BUCKET_PRIVATE\":\"$AWS_S3_BUCKET_PRIVATE\"},\"ports\":{\"3000\":\"HTTP\"}}}" \
            --public-endpoint "{\"containerName\":\"backend\",\"containerPort\":3000,\"healthCheck\":{\"path\":\"/api/health\"}}"

