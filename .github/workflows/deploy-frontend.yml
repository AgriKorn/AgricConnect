name: Frontend CD (AWS Lightsail Direct Container Push)

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
    branches:
      - main
      - feature/frontend-integration

jobs:
  build-and-deploy-frontend:
    name: Build Flutter Web & Deploy to AWS Lightsail
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web Release with Live Backend API URL
        run: flutter build web --release --base-href "/" --dart-define=API_BASE_URL=https://container-service-1.veg2jxqsfecbm.eu-west-1.cs.amazonlightsail.com/api

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Install Lightsail Control Plugin
        run: |
          sudo curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build & Push Container Image to Lightsail Native Registry
        run: |
          docker build -t agriconnect-frontend:latest .
          aws lightsail push-container-image \
            --region eu-west-1 \
            --service-name container-service-2 \
            --label agriconnect-frontend \
            --image agriconnect-frontend:latest
